[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-omd"
version = "0.1.0"
description = "Reliability-calibrated credit-weighted OMD research code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "matplotlib>=3.8,<4",
]

[tool.setuptools]
packages = ["algorithms", "environments", "experiments"]
